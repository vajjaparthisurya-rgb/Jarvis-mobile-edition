<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="jarvis-container">
  <h1>J.A.R.V.I.S</h1>
  <p class="subtitle">MOBILE EDITION</p>

  <!-- 1. Arc Reactor Core GIF/Image -->
  <div class="reactor-container">
    <div class="arc-reactor"></div>
  </div>

  <p class="core-text">CORE ACTIVE</p>

  <!-- 2. System Status Box -->
  <div class="status-box">
    <h2>SYSTEM STATUS</h2>
    <div class="status-item"><span>AI CORE</span> <span class="online">● ONLINE</span></div>
    <div class="status-item"><span>NETWORK</span> <span class="online">● ONLINE</span></div>
    <div class="status-item"><span>VOICE</span> <span class="locked">○ LOCKED</span></div>
    <div class="status-item"><span>MEMORY</span> <span class="locked">○ LOCKED</span></div>
  </div>

  <!-- Input Area -->
  <div class="input-container">
    <input type="text" placeholder="Ask J.A.R.V.I.S..." />
    <button>SEND</button>   <button class="mic-btn">🎙️</button>
  </div>
</div>

 </div>
 <script src="script.js"></script>
</body>
</html>
