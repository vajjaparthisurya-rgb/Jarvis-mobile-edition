<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS UI</title>
  
  <!-- Orbitron Sci-Fi Font Import -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif !important; /* Force Sci-Fi Font */
    }

    body {
      background-color: #000000;
      color: #00f3ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .jarvis-container {
      text-align: center;
      width: 100%;
      max-width: 360px;
    }

    h1 {
      font-size: 28px;
      margin: 0;
      letter-spacing: 3px;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
    }

    .subtitle {
      font-size: 11px;
      color: #00f3ff;
      letter-spacing: 2px;
      margin-top: 5px;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    /* Arc Reactor Ring Graphic */
    .reactor-outer {
      width: 110px;
      height: 110px;
      border: 3px solid #00f3ff;
      border-radius: 50%;
      margin: 0 auto 15px auto;
      box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .reactor-inner {
      width: 45px;
      height: 45px;
      background-color: #00f3ff;
      border-radius: 50%;
      box-shadow: 0 0 20px #00f3ff, 0 0 35px #00f3ff;
    }

    .core-text {
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: #00f3ff;
    }

    /* System Status Box */
    .status-box {
      border: 1px solid #00f3ff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
      padding: 15px;
      margin-bottom: 25px;
      background: rgba(0, 10, 20, 0.8);
      border-radius: 4px;
    }

    .status-box h3 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00f3ff;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .online {
      color: #00ff66;
      text-shadow: 0 0 8px #00ff66;
    }

    .locked {
      color: #ff0055;
      text-shadow: 0 0 8px #ff0055;
    }

    /* Input & Buttons */
    .input-area {
      display: flex;
      gap: 6px;
    }

    input {
      flex: 1;
      background: #000;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 10px;
      border-radius: 3px;
      outline: none;
      font-size: 11px;
    }

    input::placeholder {
      color: rgba(0, 243, 255, 0.5);
    }

    .send-btn {
      background: #00f3ff;
      color: #000;
      border: none;
      padding: 10px 14px;
      font-weight: bold;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 8px #00f3ff;
    }

    .mic-btn {
      background: #00f3ff;
      color: #000;
      border: none;
      padding: 10px 12px;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 8px #00f3ff;
    }
  </style>
</head>
<body>

  <div class="jarvis-container">
    <h1>J.A.R.V.I.S</h1>
    <div class="subtitle">MOBILE EDITION</div>

    <!-- Center Glowing Ring -->
    <div class="reactor-outer">
      <div class="reactor-inner"></div>
    </div>

    <div class="core-text">CORE ACTIVE</div>

    <!-- Status Details Box -->
    <div class="status-box">
      <h3>SYSTEM STATUS</h3>
      <div class="status-row"><span>AI CORE</span><span class="online">● ONLINE</span></div>
      <div class="status-row"><span>NETWORK</span><span class="online">● ONLINE</span></div>
      <div class="status-row"><span>VOICE</span><span class="locked">○ LOCKED</span></div>
      <div class="status-row"><span>MEMORY</span><span class="locked">○ LOCKED</span></div>
    </div>

    <!-- Input Section -->
    <div class="input-area">
      <input type="text" placeholder="Ask J.A.R.V.I.S..." />
      <button class="send-btn">SEND</button>
      <button class="mic-btn">🎙️</button>
    </div>
  </div>

</body>
</html>
