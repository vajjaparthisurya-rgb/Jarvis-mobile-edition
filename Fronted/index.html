<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS UI</title>

  <!-- Orbitron Sci-Fi Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif !important;
    }

    body {
      background-color: #030708;
      /* Background Tech Grid Lines */
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #00f3ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .jarvis-container {
      width: 100%;
      max-width: 360px;
    }

    /* Titles */
    h1 {
      font-size: 26px;
      margin: 0;
      text-align: center;
      letter-spacing: 4px;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
    }

    .subtitle {
      font-size: 10px;
      text-align: center;
      color: #00f3ff;
      letter-spacing: 2px;
      margin-top: 4px;
      margin-bottom: 25px;
      opacity: 0.8;
    }

    /* Multi-Ring Arc Reactor Graphics */
    .reactor-wrapper {
      width: 140px;
      height: 140px;
      margin: 0 auto 15px auto;
      border: 2px dashed #00f3ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      padding: 8px;
    }

    .reactor-outer {
      width: 100%;
      height: 100%;
      border: 4px solid #00f3ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
    }

    .reactor-inner {
      width: 38px;
      height: 38px;
      background-color: #00f3ff;
      border-radius: 50%;
      box-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
    }

    .core-text {
      font-size: 11px;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 25px;
      color: #00f3ff;
    }

    /* System Status Box */
    .status-box {
      border: 1px solid #00f3ff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
      padding: 16px;
      margin-bottom: 25px;
      background: rgba(0, 8, 15, 0.95);
      border-radius: 2px;
    }

    .status-title {
      font-size: 13px;
      margin: 0 0 15px 0;
      letter-spacing: 2px;
      text-align: left;
      color: #00f3ff;
      text-shadow: 0 0 8px #00f3ff;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .online {
      color: #00ff66;
      text-shadow: 0 0 8px #00ff66;
    }

    .locked {
      color: #ff0055;
      text-shadow: 0 0 8px #ff0055;
    }

    /* Input Controls */
    .input-area {
      display: flex;
      gap: 6px;
    }

    input {
      flex: 1;
      background: #000;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 10px;
      border-radius: 2px;
      outline: none;
      font-size: 10px;
    }

    input::placeholder {
      color: rgba(0, 243, 255, 0.5);
    }

    .send-btn {
      background: #00f3ff;
      color: #000;
      border: none;
      padding: 10px 14px;
      font-weight: bold;
      font-size: 11px;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: 0 0 8px #00f3ff;
    }

    .mic-btn {
      background: #00f3ff;
      color: #000;
      border: none;
      padding: 10px 12px;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: 0 0 8px #00f3ff;
    }
  </style>
</head>
<body>

  <div class="jarvis-container">
    <h1>J.A.R.V.I.S</h1>
    <div class="subtitle">MOBILE EDITION</div>

    <div class="reactor-wrapper">
      <div class="reactor-outer">
        <div class="reactor-inner"></div>
      </div>
    </div>

    <div class="core-text">CORE ACTIVE</div>

    <div class="status-box">
      <div class="status-title">SYSTEM STATUS</div>
      <div class="status-row"><span>AI CORE</span><span class="online">● ONLINE</span></div>
      <div class="status-row"><span>NETWORK</span><span class="online">● ONLINE</span></div>
      <div class="status-row"><span>VOICE</span><span class="locked">○ LOCKED</span></div>
      <div class="status-row"><span>MEMORY</span><span class="locked">○ LOCKED</span></div>
    </div>

    <div class="input-area">
      <input type="text" placeholder="Ask J.A.R.V.I.S..." />
      <button class="send-btn">SEND</button>
      <button class="mic-btn">🎙️</button>
    </div>
  </div>

</body>
</html>
